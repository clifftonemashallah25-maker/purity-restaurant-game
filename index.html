<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purity Restaurant Game</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff4df, #ffd59a);
    min-height: 100vh;
    color: #3b2414;
}

header {
    background: #7b2d26;
    color: white;
    padding: 15px;
    text-align: center;
    box-shadow: 0 4px 10px #0004;
}

header h1 {
    font-size: 28px;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 8px;
    font-weight: bold;
}

.game {
    max-width: 1000px;
    margin: auto;
    padding: 15px;
}

.restaurant {
    position: relative;
    min-height: 520px;
    background:
        linear-gradient(#e9c49b 0 65%, #8b5a35 65% 100%);
    border: 6px solid #5a321c;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 20px #0005;
}

/* WALL DECOR */

.wall-sign {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #5c1e18;
    color: white;
    padding: 10px 25px;
    border-radius: 8px;
    font-size: 22px;
    font-weight: bold;
}

.window {
    position: absolute;
    top: 80px;
    left: 30px;
    width: 150px;
    height: 100px;
    background: linear-gradient(#79c8ee, #dff6ff);
    border: 8px solid #704225;
}

.window:after {
    content: "";
    position: absolute;
    left: 50%;
    height: 100%;
    width: 5px;
    background: #704225;
}

.window:before {
    content: "";
    position: absolute;
    top: 50%;
    width: 100%;
    height: 5px;
    background: #704225;
}

/* CUSTOMER AREA */

.customer-area {
    position: absolute;
    top: 175px;
    left: 0;
    width: 100%;
    height: 160px;
}

.customer {
    position: absolute;
    width: 100px;
    text-align: center;
    transition: all 0.8s ease;
}

.person {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    margin: auto;
    position: relative;
    background: #d8956a;
    border: 4px solid #542817;
}

.person:after {
    content: "";
    position: absolute;
    width: 75px;
    height: 55px;
    left: -11px;
    top: 50px;
    background: #355c7d;
    border-radius: 35px 35px 5px 5px;
}

.customer-name {
    margin-top: 50px;
    font-weight: bold;
}

.order {
    margin-top: 8px;
    background: white;
    padding: 6px;
    border-radius: 8px;
    box-shadow: 0 2px 7px #0004;
}

/* TABLES */

.tables {
    position: absolute;
    bottom: 145px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
}

.table {
    width: 130px;
    height: 55px;
    background: #754323;
    border-radius: 50%;
    border: 5px solid #4d2917;
    text-align: center;
    padding-top: 12px;
    color: white;
    font-weight: bold;
}

/* KITCHEN */

.kitchen {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 140px;
    background: #262626;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px;
}

.station {
    background: #444;
    border: 3px solid #888;
    width: 130px;
    height: 105px;
    border-radius: 12px;
    text-align: center;
    color: white;
    padding: 10px;
}

.station button {
    margin-top: 10px;
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 8px;
    background: #ffb703;
    font-weight: bold;
    cursor: pointer;
}

.station button:hover {
    background: #ffd166;
}

/* CONTROLS */

.controls {
    margin-top: 15px;
    text-align: center;
}

.controls button {
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    background: #7b2d26;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}

.controls button:hover {
    background: #a63d32;
}

/* MESSAGE */

#message {
    margin-top: 10px;
    min-height: 28px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

/* RESPONSIVE */

@media(max-width:700px) {
    header h1 {
        font-size: 22px;
    }

    .stats {
        gap: 10px;
        font-size: 13px;
    }

    .window {
        display: none;
    }

    .table {
        width: 90px;
    }

    .station {
        width: 100px;
        height: 100px;
        font-size: 12px;
    }

    .customer {
        width: 80px;
    }

    .person {
        width: 50px;
        height: 50px;
    }

    .person:after {
        width: 60px;
        height: 45px;
        top: 42px;
        left: -9px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🍽️ Purity Restaurant</h1>

    <div class="stats">
        <span>⭐ Score: <b id="score">0</b></span>
        <span>❤️ Lives: <b id="lives">3</b></span>
        <span>🏆 Level: <b id="level">1</b></span>
        <span>⏱️ Time: <b id="time">60</b></span>
    </div>
</header>

<div class="game">

    <div class="restaurant">

        <div class="wall-sign">
            👩‍🍳 PURITY'S RESTAURANT
        </div>

        <div class="window"></div>

        <div class="customer-area" id="customerArea"></div>

        <div class="tables">
            <div class="table">TABLE 1</div>
            <div class="table">TABLE 2</div>
            <div class="table">TABLE 3</div>
        </div>

        <div class="kitchen">

            <div class="station">
                🔥
                <br>
                Cooking
                <button onclick="cook()">COOK</button>
            </div>

            <div class="station">
                🍽️
                <br>
                Serving
                <button onclick="serve()">SERVE</button>
            </div>

            <div class="station">
                🥤
                <br>
                Drinks
                <button onclick="drink()">DRINK</button>
            </div>

            <div class="station">
                🧹
                <br>
                Clean
                <button onclick="clean()">CLEAN</button>
            </div>

        </div>

    </div>

    <div id="message">
        Welcome to Purity Restaurant! 👩‍🍳
    </div>

    <div class="controls">
        <button onclick="startGame()">▶ START GAME</button>
        <button onclick="newCustomer()">👤 NEW CUSTOMER</button>
    </div>

</div>

<script>

let score = 0;
let lives = 3;
let level = 1;
let time = 60;

let currentOrder = null;
let gameRunning = false;
let timer;

const foods = [
    "🍔 Burger",
    "🍕 Pizza",
    "🍗 Chicken",
    "🍝 Pasta",
    "🍛 Rice",
    "🥗 Salad"
];

const names = [
    "Amina",
    "Brian",
    "Kevin",
    "Mercy",
    "David",
    "Faith",
    "John",
    "Sharon"
];

function updateStats() {

    document.getElementById("score").textContent = score;
    document.getElementById("lives").textContent = lives;
    document.getElementById("level").textContent = level;
    document.getElementById("time").textContent = time;

}

function message(text) {

    document.getElementById("message").textContent = text;

}

function startGame() {

    if (gameRunning) return;

    gameRunning = true;
    score = 0;
    lives = 3;
    level = 1;
    time = 60;

    updateStats();

    message("The restaurant is OPEN! 🍽️");

    newCustomer();

    timer = setInterval(() => {

        time--;

        updateStats();

        if (time <= 0) {

            clearInterval(timer);
            gameRunning = false;

            message(
                "⏰ Time's up! Final score: " + score
            );

        }

    }, 1000);

}

function newCustomer() {

    if (!gameRunning) {

        message("Press START GAME first!");

        return;

    }

    const area = document.getElementById("customerArea");

    area.innerHTML = "";

    const customer = document.createElement("div");

    customer.className = "customer";

    customer.style.left =
        Math.random() * 80 + 5 + "%";

    const name =
        names[Math.floor(Math.random() * names.length)];

    const food =
        foods[Math.floor(Math.random() * foods.length)];

    currentOrder = food;

    customer.innerHTML = `

        <div class="person"></div>

        <div class="customer-name">
            ${name}
        </div>

        <div class="order">
            Wants:<br>
            <b>${food}</b>
        </div>

    `;

    area.appendChild(customer);

    message(
        "👋 " + name + " has arrived! Prepare the order."
    );

}

function cook() {

    if (!gameRunning) return;

    message(
        "🔥 Cooking " + currentOrder + "..."
    );

    setTimeout(() => {

        message(
            "✅ " + currentOrder +
            " is ready! Serve the customer."
        );

    }, 800);

}

function serve() {

    if (!gameRunning) return;

    if (!currentOrder) {

        message("❌ There is no customer!");

        return;

    }

    score += 10 * level;

    message(
        "🎉 Great service! +" +
        (10 * level) +
        " points!"
    );

    document.getElementById("customerArea").innerHTML = "";

    currentOrder = null;

    if (score >= level * 100) {

        level++;

        time += 15;

        message(
            "🔥 LEVEL UP! Welcome to Level " +
            level +
            "!"
        );

    }

    updateStats();

    setTimeout(() => {

        if (gameRunning) {
            newCustomer();
        }

    }, 1200);

}

function drink() {

    if (!gameRunning) return;

    score += 5;

    message(
        "🥤 Drink served! +5 points"
    );

    updateStats();

}

function clean() {

    if (!gameRunning) return;

    score += 3;

    message(
        "🧹 Table cleaned! +3 points"
    );

    updateStats();

}

</script>

</body>
</html>
